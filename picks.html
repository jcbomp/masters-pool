<style>
:root {
  --green-dark: #003d2e;
  --green-mid: #006747;
  --green-light: #00875a;

  --white: #f0f0ec;
  --red: #d04040;
  --grey-card: #1a2e28;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--green-dark);
  color: var(--white);
  font-family: 'Roboto Mono', 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

header {
  background: var(--green-mid);
  border-bottom: 3px solid var(--gold);
  text-align: center;
  padding: 24px 16px 18px;
}

header h1 {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
}

header .subtitle {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--white);
  text-transform: uppercase;
  opacity: 0.8;
}

.deadline-banner {
  background: rgba(0,0,0,0.3);
  text-align: center;
  padding: 10px 16px;
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  color: var(--gold);
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px;
}

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Email screen */

  border-radius: 8px;

  margin-top: 24px;
  text-align: center;
}

.email-form h2 {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 20px;
  color: var(--gold);
  margin-bottom: 8px;
}

.email-form p {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 16px;
}

.input-group label {
  display: block;
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 6px;
  text-align: left;
}

input[type="text"],
input[type="email"] {
  width: 100%;
  padding: 12px 14px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  color: var(--white);
  font-family: 'Roboto Mono', monospace;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--gold);
}

.btn {
  display: inline-block;
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green-dark);
  background: var(--gold);
  border: none;
  padding: 14px 32px;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.2s;
  width: 100%;
}

.btn:hover { opacity: 0.9; }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  margin-top: 12px;
}

/* Tier sections */
.tier-section {
  background: var(--grey-card);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.tier-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.tier-title {

  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}

.tier-count {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}

.tier-count.complete {
  color: var(--green-light);
  font-weight: 700;
}

.golfer-list {
  padding: 4px 0;
}

.golfer-row {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.golfer-row:last-child { border-bottom: none; }
.golfer-row:hover { background: rgba(255,255,255,0.04); }
.golfer-row.selected { background: rgba(242,199,92,0.1); }
.golfer-row.disabled { opacity: 0.35; cursor: not-allowed; }

.golfer-check {

  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 3px;
  margin-right: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.golfer-row.selected .golfer-check {
  background: var(--gold);
  border-color: var(--gold);
}

.golfer-row.selected .golfer-check::after {
  content: '\2713';
  color: var(--green-dark);
  font-size: 14px;
  font-weight: 700;
}

.golfer-info {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.golfer-name {
  font-size: 14px;
}

.golfer-odds {
  font-size: 12px;
  color: var(--gold-dim);
  margin-left: 8px;
  white-space: nowrap;
}

/* Existing picks display */

.pick-item {

  font-size: 14px;

.pick-item:last-child { border-bottom: none; }

.pick-tier {

  font-size: 12px;

.pick-name { flex: 1; }

/* Confirmation */
.confirmation {

.confirmation .check-icon {

.confirmation h2 {

.confirmation p {

.confirmation .picks-summary {

.scoreboard-link {

.scoreboard-link:hover { text-decoration: underline; }

/* Error */
.error-msg {

  margin-bottom: 16px;
  font-size: 13px;
  color: var(--red);

.error-msg.show { display: block; }

/* Loading spinner */

  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: var(--gold);
  border-radius: 50%;

  margin-right: 8px;
  vertical-align: middle;

@keyframes spin { to { transform: rotate(360deg); } }

footer {

footer a { color: var(--gold-dim); text-decoration: none; }

@media (max-width: 640px) {

  .email-form { padding: 24px 16px; }
  .golfer-row { padding: 10px 12px; }
  .golfer-name { font-size: 13px; }

/* ==============================================================
   STATE
   ============================================================== */
const selections = { tier1: [], tier2: [], tier3: [] };
let userEmail = '';
let userName = '';

/* ==============================================================
   DEADLINE CHECK
   ============================================================== */
function isPastDeadline() {
  return new Date() > CONFIG.deadline;
}

(function checkDeadline() {
  if (isPastDeadline()) {
    document.getElementById('deadline-banner').textContent = 'PICKS ARE CLOSED';
    document.getElementById('deadline-banner').style.background = 'rgba(208,64,64,0.3)';
    document.getElementById('deadline-banner').style.color = '#ff6b6b';
    document.getElementById('email-continue').disabled = true;
    document.getElementById('email-continue').textContent = 'Picks Closed';
  }
})();

/* ==============================================================
   INFO SCREEN → PICKS
   ============================================================== */
function goToPicks() {
  const firstName = document.getElementById('first-name-input').value.trim();
  const lastName = document.getElementById('last-name-input').value.trim();
  const email = document.getElementById('email-input').value.trim();
  const errorEl = document.getElementById('email-error');

  if (!firstName || !lastName) {
    errorEl.textContent = 'Please enter your first and last name.';
    errorEl.classList.add('show');
    return;
  }
  if (!email || !email.includes('@')) {
    errorEl.textContent = 'Please enter a valid email address.';
    errorEl.classList.add('show');
    return;
  }

  errorEl.classList.remove('show');
  userName = firstName + ' ' + lastName;
  userEmail = email;
  showPickForm();
}

// Allow Enter key on inputs
document.getElementById('email-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') goToPicks();
});
document.getElementById('last-name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') goToPicks();
});

/* ==============================================================
   PICK FORM
   ============================================================== */
function showPickForm() {
  renderTiers();
  switchScreen('screen-picks');
}

function renderTiers() {
  const container = document.getElementById('tier-sections');
  let html = '';

  for (const [tierKey, tier] of Object.entries(TIERS)) {
    html += `
      <div class="tier-section">
        <div class="tier-header">
          <span class="tier-title">${tier.label} &mdash; Pick ${tier.required}</span>
          <span class="tier-count" id="count-${tierKey}">0 of ${tier.required}</span>
        </div>
        <div class="golfer-list">`;

    for (const g of tier.golfers) {
      html += `
          <div class="golfer-row" id="row-${tierKey}-${g.rank}" onclick="toggleGolfer('${tierKey}', ${g.rank})">
            <div class="golfer-check"></div>
            <div class="golfer-info">
              <span class="golfer-name">${g.rank}. ${esc(g.name)}</span>
              <span class="golfer-odds">(${g.odds})</span>
            </div>
          </div>`;
    }

    html += `
        </div>
      </div>`;
  }

  container.innerHTML = html;
}

function toggleGolfer(tierKey, rank) {
  const tier = TIERS[tierKey];
  const idx = selections[tierKey].indexOf(rank);
  const row = document.getElementById(`row-${tierKey}-${rank}`);

  if (idx > -1) {
    // Deselect
    selections[tierKey].splice(idx, 1);
    row.classList.remove('selected');
  } else {
    // Check limit
    if (selections[tierKey].length >= tier.required) return;
    selections[tierKey].push(rank);
    row.classList.add('selected');
  }

  updateTierUI(tierKey);
  updateSubmitButton();
}

function updateTierUI(tierKey) {
  const tier = TIERS[tierKey];
  const count = selections[tierKey].length;
  const countEl = document.getElementById(`count-${tierKey}`);
  countEl.textContent = `${count} of ${tier.required}`;

  if (count >= tier.required) {
    countEl.classList.add('complete');
  } else {
    countEl.classList.remove('complete');
  }

  // Disable unselected rows when limit reached
  for (const g of tier.golfers) {
    const row = document.getElementById(`row-${tierKey}-${g.rank}`);
    if (count >= tier.required && !selections[tierKey].includes(g.rank)) {
      row.classList.add('disabled');
    } else {
      row.classList.remove('disabled');
    }
  }
}

function updateSubmitButton() {
  const valid =
    selections.tier1.length === TIERS.tier1.required &&
    selections.tier2.length === TIERS.tier2.required &&
    selections.tier3.length === TIERS.tier3.required;

  document.getElementById('submit-btn').disabled = !valid;
}

/* ==============================================================
   SUBMIT
   ============================================================== */
async function submitPicks() {
  const btn = document.getElementById('submit-btn');
  const errorEl = document.getElementById('picks-error');

  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';

  const getNames = (tierKey) =>
    selections[tierKey].map(rank =>
      TIERS[tierKey].golfers.find(g => g.rank === rank).name
    );

  const payload = {
    name: userName,
    email: userEmail,
    tier1: getNames('tier1'),
    tier2: getNames('tier2'),
    tier3: getNames('tier3'),
  };

  try {
    const resp = await fetch(CONFIG.appsScriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      mode: 'no-cors',
    });

    // With no-cors we can't read the response, but if it didn't throw, assume success
    // For Apps Script redirects, we need to handle this differently
    showConfirmation(payload);
  } catch (err) {
    // If Apps Script URL not set, still show confirmation for testing
    if (CONFIG.appsScriptUrl === 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
      showConfirmation(payload);
    } else {
      errorEl.textContent = 'Error submitting picks. Please try again.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Submit Picks';
    }
  }
}

/* ==============================================================
   CONFIRMATION
   ============================================================== */
function showConfirmation(payload) {
  let html = '';
  payload.tier1.forEach(p => {
    html += `<div class="pick-item"><span class="pick-tier">Tier 1</span><span class="pick-name">${esc(p)}</span></div>`;
  });
  payload.tier2.forEach(p => {
    html += `<div class="pick-item"><span class="pick-tier">Tier 2</span><span class="pick-name">${esc(p)}</span></div>`;
  });
  payload.tier3.forEach(p => {
    html += `<div class="pick-item"><span class="pick-tier">Tier 3</span><span class="pick-name">${esc(p)}</span></div>`;
  });

  document.getElementById('confirm-picks').innerHTML = html;
  switchScreen('screen-confirm');
}

/* ==============================================================
   UTILS
   ============================================================== */
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
